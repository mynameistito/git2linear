name: Verify Worker

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Worker operation
        type: choice
        required: true
        default: status
        options:
          - status
          - dry-run

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'mynameistito/git2linear' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Load operator credential
        id: operator
        uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          version: 2.39.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          MANUAL_TRIGGER_TOKEN: op://github-actions/7qcdyu375b6v2xep2xovcnnhjy/MANUAL_TRIGGER_TOKEN
      - name: Verify Worker
        env:
          MANUAL_TRIGGER_TOKEN: ${{ steps.operator.outputs.MANUAL_TRIGGER_TOKEN }}
          WORKER_ORIGIN: https://git2linear.mynameistito.workers.dev
          OPERATION: ${{ inputs.operation }}
        run: |
          case "$OPERATION" in
            status|dry-run) bun run varlock:operate "$OPERATION" ;;
            *) echo 'Unsupported operation' >&2; exit 1 ;;
          esac
