name: Verify Worker

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Worker operation
        type: choice
        required: true
        default: status
        options:
          - status
          - dry-run

permissions:
  contents: read

jobs:
  validate_1password:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'mynameistito/git2linear' &&
      github.ref == 'refs/heads/chore/git2linear-verified-refs'
    permissions: {}
    runs-on: ubuntu-24.04
    steps:
      - name: Load target references
        id: op
        uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          version: 2.39.0
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TARGET_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_DEPLOY_API_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/pvt53g6cq5kb5mklpsgamyuwou/cloudflare_deploy_api_token
          APP_GITHUB_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/pvt53g6cq5kb5mklpsgamyuwou/credential
          APP_LINEAR_API_KEY: op://i56qshgciuy4cdg4pjrilaeriy/pvt53g6cq5kb5mklpsgamyuwou/linear_api_key
          APP_LINEAR_WEBHOOK_URL: op://i56qshgciuy4cdg4pjrilaeriy/pvt53g6cq5kb5mklpsgamyuwou/linear_webhook_url
          APP_LINEAR_WEBHOOK_SECRET: op://i56qshgciuy4cdg4pjrilaeriy/pvt53g6cq5kb5mklpsgamyuwou/linear_webhook_secret
          APP_MANUAL_TRIGGER_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/pvt53g6cq5kb5mklpsgamyuwou/manual_trigger_token
      - name: Check values are present
        env:
          CLOUDFLARE_DEPLOY_API_TOKEN: ${{ steps.op.outputs.CLOUDFLARE_DEPLOY_API_TOKEN }}
          APP_GITHUB_TOKEN: ${{ steps.op.outputs.APP_GITHUB_TOKEN }}
          APP_LINEAR_API_KEY: ${{ steps.op.outputs.APP_LINEAR_API_KEY }}
          APP_LINEAR_WEBHOOK_URL: ${{ steps.op.outputs.APP_LINEAR_WEBHOOK_URL }}
          APP_LINEAR_WEBHOOK_SECRET: ${{ steps.op.outputs.APP_LINEAR_WEBHOOK_SECRET }}
          APP_MANUAL_TRIGGER_TOKEN: ${{ steps.op.outputs.APP_MANUAL_TRIGGER_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_DEPLOY_API_TOKEN"
          test -n "$APP_GITHUB_TOKEN"
          test -n "$APP_LINEAR_API_KEY"
          test -n "$APP_LINEAR_WEBHOOK_URL"
          test -n "$APP_LINEAR_WEBHOOK_SECRET"
          test -n "$APP_MANUAL_TRIGGER_TOKEN"
  verify:
    if: github.repository == 'mynameistito/git2linear' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Load operator credential
        id: operator
        uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        with:
          version: 2.39.0
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TARGET_SERVICE_ACCOUNT_TOKEN }}
          MANUAL_TRIGGER_TOKEN: op://i56qshgciuy4cdg4pjrilaeriy/pvt53g6cq5kb5mklpsgamyuwou/manual_trigger_token
      - name: Verify Worker
        env:
          MANUAL_TRIGGER_TOKEN: ${{ steps.operator.outputs.MANUAL_TRIGGER_TOKEN }}
          WORKER_ORIGIN: https://git2linear.mynameistito.workers.dev
          OPERATION: ${{ inputs.operation }}
        run: |
          case "$OPERATION" in
            status|dry-run) bun run varlock:operate "$OPERATION" ;;
            *) echo 'Unsupported operation' >&2; exit 1 ;;
          esac
