name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run knip
      - run: bun run test
      - run: bun run typecheck
      - run: bun run check
      - name: Build with a non-production team ID
        run: bun run build
        env:
          LINEAR_TEAM_ID: 00000000-0000-4000-8000-000000000000
